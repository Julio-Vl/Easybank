<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBank</title>
    <link rel="stylesheet" href="../Styles/index.css">
    <link rel="stylesheet" href="../Styles/cartao.css">
    <link rel="icon" href="../assets/imgs/Easy(1).png" type="image/x-icon">
</head>

<body>
    <header>
        <div class="logo">
            <a href="../index.html"><h1>Easy<span>Bank</span></h1></a>
        </div>
        <nav>
            <ul>
                <li><a href="userArea.html">Área do usuário</a></li>
                <li><a href="investimentos.html">Investimentos</a></li>
                <li><a href="noticias.html">Notícias</a></li>
            </ul>
        </nav>
        <div class="profile">
            <a href="userArea.html">
                <div class="profile-icon"></div>
            </a>
        </div>

    </header>
    
    <main class="principal-content">
        <section class="main-content">
            <div class="banner__cartao">
                <!-- 1º linha -->
                <div class="cartao">
                    <h2 class="cartao__titulo">Cartão digital</h2>
                    <h3 class="cartao__dono">Nome completo da pessoa</h3>
                    <hr class="linha__cartao">
                    <p class="cartao__numero">1234 5678 9123 4567</p>
                </div>
        
                <!-- 2º linha -->
                <div class="cartao__linhadois">
                    <div class="seguranca__cartao">
                        <p>CVV</p>
                        <p>758</p>
                    </div>
    
                    <div class="validade__cartao">
                        <p>Validade</p>
                        <p>04/30</p>
                    </div>
                </div>

                <div class="easybank__cartao">
                    <h1>Easy<span>Bank</span></h1>
                </div>

            </div>

            <div class="container__cartao">
                <!-- Botão 1 -->
                <div class="container">
                    <input type="checkbox" id="menu_compras" class="container__botao" hidden>
                    <label class="switch" for="menu_compras">
                        <span class="slider round"></span>
                        <span class="text">Permitir compras online</span>
                    </label>
                </div>

                <!-- Botão 2 -->
                <div class="container">
                    <input type="checkbox" id="menu_comprasexterior" class="container__botao" hidden>
                    <label class="switch" for="menu_comprasexterior">
                        <span class="slider round"></span>
                        <span class="text">Usar em viagens ao exterior</span>
                    </label>
                </div>

                <!-- Botão 3 -->
                <div class="container">
                    <input type="checkbox" id="menu" class="container__botao" hidden>
                    <label class="switch" for="menu">
                        <span class="slider round"></span>
                        <span class="text">Permitir pagamento por aproximação</span>
                    </label>
                </div>

            </div>
            
            
        
        </section>
    </main>

    <footer>
        <div class="comments-section">
            <div class="comment-icon"></div>
            <input type="text" placeholder="Comentários ..........">
        </div>
        <div class="footer-text">2024 EasyBank - Todos os direitos reservados</div>
    </footer>
            
</body>
