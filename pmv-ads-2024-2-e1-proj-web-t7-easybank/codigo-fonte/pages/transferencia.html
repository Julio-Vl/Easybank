<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferência - EasyBank</title>
    <link rel="stylesheet" href="../Styles/transferencia.css">
    <link rel="stylesheet" href="../Styles/index.css">
</head>
<body>
<header>
    <div class="logo">
        <a href="../index.html"><h1>Easy<span>Bank</span></h1></a>    
    </div>
    <nav>
        <ul>
            <li><a href="userArea.html">Área do Usuário</a></li>
            <li><a href="investimentos.html">Investimentos</a></li>
            <li><a href="noticias.html">Notícias</a></li>
        </ul>
    </nav>
    <div class="profile">
        <a href="userArea.html">
            <div id="profile-icon"></div>
        </a>
    </div>
</header>
<main>
    <div class="transfer-container">
        <h1>Transferência Bancária</h1>
        <form id="transfer-form">
            <label for="account-number">Número da Conta</label>
            <input type="text" id="account-number" name="account-number" placeholder="Digite o número da conta" minlength="6" maxlength="10" required>
        
            <label for="agency-number">Número da Agência</label>
            <input type="text" id="agency-number" name="agency-number" placeholder="Digite o número da agência" minlength="4" maxlength="6" required>
        
            <label for="amount">Valor da Transferência</label>
            <input type="number" id="amount" name="amount" placeholder="Digite o valor" required>
        
            <label for="recipient-name">Nome do Destinatário</label>
            <input type="text" id="recipient-name" name="recipient-name" placeholder="Nome do destinatário" required>
        
            <button type="button" onclick="confirmTransfer()">Confirmar Transferência</button>
        </form>
        <p id="message"></p>
    </div>
</main>
<footer>
    <div class="footer-text">2024 EasyBank - Todos os direitos reservados</div>
</footer>
<script src="../Scripts/trasferencia.js"></script>
</body>
</html>
