</head>
<body>
    <header>
        <div class="logo">
            <a href="../index.html"><h1>Easy<span>Bank</span></h1></a>
        </div>
        <nav>
            <ul>
                <li><a href="userArea.html">Área do usuário</a></li>

            <a href="userArea.html">
                <div id="profile-icon"></div>

    <main>
        <div class="login-container">
            <img src="../assets/imgs/login_img.svg" alt="loginImg">
            <h2>Login</h2>
           <form id="form-login">
                <label for="email" required>E-mail:</label>
                <input type="email" id="email" placeholder="johnDoe@email.com" required><br>  
                <label for="password" required>Senha:</label>
                <input type="password" id="password" placeholder="MySecretPassword" required>
                <button type="submit">Logar</button>
                <br>
                <button id="formButtonId"><a href="../pages/cadastro.html">Cadastre-se</a></button>
                <button id="formButtonId" href="">Esqueci Minha Senha</button>

           </form>
        </div>
    </main>
    <footer>
        <div class="footer-text">2024 EasyBank - Todos os direitos reservados</div>
    </footer>
    <script src="../Scripts/login.js"></script>
